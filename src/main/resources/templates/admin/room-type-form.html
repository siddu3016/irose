<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Room Type')}"></th:block></head>
<body>
<div class="admin-wrap">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="admin-main" style="max-width:860px">
        <a class="small" th:href="@{/admin/room-types}">&larr; Room types</a>
        <h1 class="h3 mb-3" th:text="${roomType.id} == null ? 'Add room type' : 'Edit ' + ${roomType.name}"></h1>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>
        <form th:action="@{/admin/room-types}" th:object="${roomType}" method="post" class="card card-body border-0 shadow-sm p-4">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-sm-8">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" th:field="*{name}" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="pricePerNight">Price per night (₹)</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{pricePerNight}" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{pricePerNight}"></div>
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="originalPrice">Original price (₹) <span class="small text-muted">(shown crossed out)</span></label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{originalPrice}" th:errorclass="is-invalid">
                    <div class="form-text">Leave empty for no offer.</div>
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="maxGuests">Max guests</label>
                    <input class="form-control" type="number" min="1" th:field="*{maxGuests}" th:errorclass="is-invalid">
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="bedType">Bed type</label>
                    <input class="form-control" th:field="*{bedType}" placeholder="e.g. King bed">
                </div>
                <div class="col-sm-4">
                    <label class="form-label" for="sizeSqft">Size (sq.ft)</label>
                    <input class="form-control" type="number" min="0" th:field="*{sizeSqft}">
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label" for="amenities">Amenities <span class="small text-muted">(comma separated)</span></label>
                    <input class="form-control" th:field="*{amenities}" placeholder="Free Wi-Fi, Air conditioning, LED TV">
                </div>
                <div class="col-12">
                    <label class="form-label" for="imageFile">Photo file name</label>
                    <input class="form-control" th:field="*{imageFile}" placeholder="deluxe.jpg">
                    <div class="form-text">Put the photo in <code>src/main/resources/static/images/rooms/</code> and type its file name here.</div>
                </div>
            </div>
            <div class="mt-4"><button class="btn btn-olive" type="submit">Save</button></div>
        </form>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
