<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Invoice ' + ${invoice.invoiceNumber})}"></th:block></head>
<body class="bg-light">
<div class="container py-4" style="max-width:820px" th:with="b=${invoice.booking}">
    <div class="d-flex justify-content-between mb-3 no-print">
        <a th:href="@{/admin/bookings/{id}(id=${b.id})}">&larr; Back to booking</a>
        <button class="btn btn-olive" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
    </div>
    <th:block th:replace="~{fragments/layout :: flash}"></th:block>
    <div class="card border-0 shadow-sm p-4 p-md-5">
        <div class="d-flex justify-content-between flex-wrap gap-3 border-bottom pb-3 mb-3">
            <div>
                <h1 class="h4 mb-1 text-olive"><i class="bi bi-flower1 text-gold"></i> <span th:text="${hotel.name}"></span></h1>
                <div class="small" th:text="${hotel.address}"></div>
                <div class="small">Phone: <span th:text="${hotel.phone}"></span> · <span th:text="${hotel.email}"></span></div>
            </div>
            <div class="text-md-end">
                <div class="h5 mb-1">TAX INVOICE</div>
                <div class="small">No: <strong th:text="${invoice.invoiceNumber}"></strong></div>
                <div class="small">Date: <span th:text="${#temporals.format(invoice.issuedAt, 'dd MMM yyyy')}"></span></div>
            </div>
        </div>

        <div class="row mb-4 small">
            <div class="col-sm-6">
                <div class="text-muted">Billed to</div>
                <div class="fw-semibold" th:text="${b.guest.fullName}"></div>
                <div th:text="${b.guest.phone}"></div>
                <div th:text="${b.guest.city}"></div>
            </div>
            <div class="col-sm-6 text-sm-end">
                <div>Booking: <strong th:text="${b.bookingCode}"></strong></div>
                <div>Room: <span th:text="${b.room?.roomNumber}"></span> (<span th:text="${b.roomType.name}"></span>)</div>
                <div>Stay: <span th:text="${#temporals.format(b.checkInDate, 'dd MMM yyyy')} + ' to ' + ${#temporals.format(b.checkOutDate, 'dd MMM yyyy')}"></span></div>
            </div>
        </div>

        <table class="table">
            <thead class="table-light"><tr><th>Description</th><th class="text-end">Amount (₹)</th></tr></thead>
            <tbody>
            <tr>
                <td th:text="'Room charges - ' + ${b.nights()} + ' night(s) × ₹' + ${#numbers.formatDecimal(b.nightlyRate, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(invoice.roomCharges, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr th:each="c : ${b.extraCharges}">
                <td th:text="${c.description}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(c.amount, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr th:if="${invoice.discount.signum() > 0}">
                <td>Discount</td>
                <td class="text-end" th:text="'- ' + ${#numbers.formatDecimal(invoice.discount, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr class="fw-semibold">
                <td>Taxable amount</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(invoice.taxableAmount(), 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr>
                <td th:text="'CGST @ ' + ${invoice.halfGstRate()} + '%'"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(invoice.halfGstAmount(), 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr>
                <td th:text="'SGST @ ' + ${invoice.halfGstRate()} + '%'"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(invoice.gstAmount.subtract(invoice.halfGstAmount()), 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            <tr class="fs-5 fw-bold">
                <td>Grand total</td>
                <td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(invoice.total, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tbody>
        </table>
        <div class="small">Paid by: <strong th:text="${invoice.paymentMethod}"></strong></div>
        <p class="text-center small text-muted mt-4 mb-0">Thank you for staying with us. We hope to see you again!</p>
    </div>
</div>
</body>
</html>
