<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Rooms')}"></th:block></head>
<body>
<div class="admin-wrap">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <main class="admin-main">
        <h1 class="h3 mb-3">Rooms</h1>
        <th:block th:replace="~{fragments/layout :: flash}"></th:block>

        <form th:action="@{/admin/rooms}" method="post" class="card card-body border-0 shadow-sm mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-sm-3"><label class="form-label small" for="roomNumber">Room number</label>
                    <input class="form-control" id="roomNumber" name="roomNumber" required></div>
                <div class="col-sm-2"><label class="form-label small" for="floor">Floor</label>
                    <input class="form-control" id="floor" name="floor" type="number" min="0"></div>
                <div class="col-sm-4"><label class="form-label small" for="roomTypeId">Room type</label>
                    <select class="form-select" id="roomTypeId" name="roomTypeId" required>
                        <option th:each="t : ${roomTypes}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select></div>
                <div class="col-sm-3"><button class="btn btn-olive w-100" type="submit"><i class="bi bi-plus-lg"></i> Add room</button></div>
            </div>
        </form>

        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light"><tr><th>Room</th><th>Floor</th><th>Type</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${rooms}">
                        <td class="fw-semibold" th:text="${r.roomNumber}"></td>
                        <td th:text="${r.floor}"></td>
                        <td th:text="${r.roomType.name}"></td>
                        <td><span class="badge" th:classappend="'st-' + ${r.status.name()}" th:text="${r.status.name()}"></span></td>
                        <td class="text-end">
                            <form th:action="@{/admin/rooms/{id}/status(id=${r.id})}" method="post" class="d-inline-flex gap-1">
                                <select class="form-select form-select-sm" name="status" style="width:auto">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}" th:selected="${s == r.status}"></option>
                                </select>
                                <button class="btn btn-sm btn-outline-olive" type="submit">Set</button>
                            </form>
                            <form th:action="@{/admin/rooms/{id}/delete(id=${r.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this room?')">
                                <button class="btn btn-sm btn-link text-danger" type="submit" title="Delete"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
