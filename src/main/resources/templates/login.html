<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><th:block th:replace="~{fragments/layout :: head('Staff Login')}"></th:block></head>
<body class="bg-olive-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card border-0 shadow p-4" style="width:100%;max-width:400px">
        <div class="text-center mb-4">
            <i class="bi bi-flower1 text-gold" style="font-size:2.5rem"></i>
            <h1 class="h4 mt-2" th:text="${hotel.name}">Hotel</h1>
            <p class="text-muted small mb-0">Front office login</p>
        </div>
        <div th:if="${param.error}" class="alert alert-danger small">Wrong username or password.</div>
        <div th:if="${param.logout}" class="alert alert-success small">You have been logged out.</div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-olive w-100" type="submit">Log in</button>
        </form>
        <a class="small text-center d-block mt-3" th:href="@{/}">&larr; Back to website</a>
    </div>
</div>
</body>
</html>
