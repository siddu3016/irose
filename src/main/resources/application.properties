spring.application.name=olive-hotel
server.port=${PORT:8080}

# Database: H2 file database stored in ./data (no separate DB install needed).
# To switch to MySQL later, replace these with a MySQL URL and add the mysql-connector-j dependency.
spring.datasource.url=jdbc:h2:file:./data/olivehotel;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.thymeleaf.cache=false

# ---- Hotel details (edit these) ----
hotel.name=iRose Olive Business Hotel
hotel.phone=8374661394
hotel.email=info@iroseolivehotel.com
hotel.address=Hyderabad, Telangana, India
hotel.check-in-time=12:00 PM
hotel.check-out-time=11:00 AM

# GST on room tariff: rate depends on the per-night tariff.
# Verify current rates with your accountant before issuing invoices.
hotel.gst.threshold=7500
hotel.gst.rate-at-or-below=5
hotel.gst.rate-above=18

# ---- Admin login ----
# Set the real password with the ADMIN_PASSWORD environment variable; never commit it here.
# "admin123" is only a local development default.
hotel.admin.username=${ADMIN_USERNAME:admin}
hotel.admin.password=${ADMIN_PASSWORD:admin123}
